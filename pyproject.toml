[project]
name = "enterprise-nested-langgraph"
version = "0.1.0"
description = "Production-grade hierarchical LangGraph system with research, analytics, and reporting subgraphs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sushant Shambharkar", email = "sam1064max@gmail.com" }
]
keywords = ["langgraph", "langchain", "ai-agents", "multi-agent", "observability"]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "coverage>=7.5.0",
]

[project.scripts]
enterprise-langgraph = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "F", "W",        # pycodestyle, pyflakes
    "I",                   # isort
    "B",                   # bugbear
    "UP",                  # pyupgrade
    "N",                   # pep8-naming
    "C4",                  # comprehensions
    "SIM",                 # simplify
    "RUF",                 # ruff-specific
    "ANN",                 # annotations
    "ASYNC",               # async
    "S",                   # security
    "TCH",                 # type-checking
    "PT",                  # pytest
    "RET",                 # return
    "ARG",                 # unused arguments
    "PL",                  # pylint
    "PIE",                 # flake8-pie
]
ignore = [
    "S101",  # allow assert in tests
    "PLR0913",  # allow many args for config
    "ANN101",  # self/cls annotations are redundant
    "ANN102",  # cls in classmethods
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004", "ARG", "ANN"]
"app.py" = ["PLR0915"]  # app entrypoint may be long

[tool.ruff.lint.isort]
known-first-party = ["config", "graphs", "models", "guardrails", "tools", "observability", "storage"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = []
exclude = ["\\.venv", "build", "dist"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "unit: Unit tests.",
    "integration: Integration tests.",
    "workflow: End-to-end workflow tests.",
    "slow: Slow-running tests.",
]

[tool.coverage.run]
branch = true
source = ["app.py", "config", "graphs", "models", "guardrails", "tools", "observability", "storage"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 60
